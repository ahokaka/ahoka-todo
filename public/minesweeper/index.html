<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>Minesweeper — Anton’s Arcade</title>
<meta name="theme-color" content="#090807" />
<link rel="stylesheet" href="style.css?v=6" />
</head>
<body>
  <header class="arcade-header">
    <a class="arcade-brand" href="../index.html">ANTON’S ARCADE</a>
    <div class="header-actions">
      <button class="lang-btn" type="button" data-lang-toggle data-i18n-aria="lang.aria">EN</button>
      <a class="back-link" href="../index.html" data-i18n="back">← Back home</a>
    </div>
  </header>
  <main class="desktop">
    <div class="game-intro">
      <span data-i18n="intro.kicker">NO. 001 / A LITTLE LOGIC, A LITTLE JOY.</span>
      <h1><span class="title-main" data-i18n="intro.title">Minesweeper</span><span class="title-alt" data-i18n="intro.titleCn">扫雷</span></h1>
      <p data-i18n="intro.lead">Once you land, start with the squares under your feet.</p>
    </div>
    <div class="window" id="gameWindow">
      <!-- Title bar -->
      <div class="titlebar">
        <div class="titlebar-left">
          <span class="titlebar-text" data-i18n="titlebar.field">THE PLAYING FIELD</span>
        </div>
        <span class="game-badge" data-i18n="titlebar.badge">LOGIC / PLAY</span>
      </div>

      <!-- Menu bar -->
      <div class="menubar">
        <button class="menu-btn" id="menuGame" data-menu="game" data-i18n="menu.game">Game</button>
        <button class="menu-btn" id="menuHelp" data-menu="help" data-i18n="menu.help">Help</button>
      </div>

      <!-- Dropdown menus -->
      <div class="menu-popover" id="popoverGame" hidden>
        <button type="button" class="menu-item" data-action="new"><span data-i18n="menu.new">New</span><span class="menu-short">F2</span></button>
        <div class="menu-sep"></div>
        <button type="button" class="menu-item" data-action="beginner"><span data-i18n="menu.beginner">Beginner</span><span class="menu-check" id="checkBeginner">✓</span></button>
        <button type="button" class="menu-item" data-action="intermediate"><span data-i18n="menu.intermediate">Intermediate</span><span class="menu-check"></span></button>
        <button type="button" class="menu-item" data-action="expert"><span data-i18n="menu.expert">Expert</span><span class="menu-check"></span></button>
        <div class="menu-sep"></div>
        <button type="button" class="menu-item" data-action="sound"><span data-i18n="menu.sound">Sound</span><span class="menu-check" id="checkSound">✓</span></button>
      </div>
      <div class="menu-popover" id="popoverHelp" hidden>
        <button type="button" class="menu-item" data-action="howto"><span data-i18n="menu.howto">How to Play</span></button>
        <button type="button" class="menu-item" data-action="about"><span data-i18n="menu.about">About</span></button>
      </div>

      <!-- Game shell -->
      <div class="game-shell">
        <!-- Top row -->
        <div class="top-panel">
          <div class="counter" id="mineCounter" data-i18n-label="counter.mines" aria-label="Mine counter">010</div>
          <div class="top-center">
            <button class="face" id="faceButton" data-i18n-aria="face.new" aria-label="New game">🙂</button>
            <button class="face pause-btn" id="pauseButton" data-i18n-aria="face.pause" aria-label="Pause">⏸</button>
          </div>
          <div class="counter" id="timerCounter" data-i18n-label="counter.time" aria-label="Timer">00:00</div>
        </div>

        <!-- Board -->
        <div class="board-wrap">
          <div class="board" id="board" role="grid"></div>
          <div class="pause-overlay" id="pauseOverlay" hidden>
            <span class="pause-msg" data-i18n="pause.msg">⏸ PAUSED</span>
          </div>
        </div>

        <div class="statusbar">
          <span id="statusText" data-i18n="status.ready">Ready</span>
          <span class="status-hint" data-i18n="status.flagHint">Right-click to flag</span>
        </div>

        <!-- Seed controls -->
        <div class="seed-panel">
          <label class="seed-label" for="seedInput" data-i18n="seed.label">Seed</label>
          <input id="seedInput" class="seed-input" type="text" maxlength="40"
                 placeholder="e.g. ABC123" data-i18n-placeholder="seed.placeholder" spellcheck="false" autocomplete="off" />
          <button id="seedApply" class="seed-btn" data-i18n="seed.apply" data-i18n-title="seed.applyTitle" title="New game with this seed">New</button>
          <button id="seedRandom" class="seed-btn" data-i18n-title="seed.randomTitle" title="Random seed">🎲</button>
        </div>
      </div>
    </div>
    <p class="game-footnote" data-i18n="footnote">Left-click to reveal · Right-click to flag · F2 restart · P pause</p>
  </main>

<script src="i18n.js?v=6"></script>
<script>
  // Embedded mode: the homepage opens this page inside its arcade panel,
  // so drop the page chrome and keep only the game itself.
  (function () {
    var params = new URLSearchParams(location.search);
    var framed = true;
    try { framed = window.self !== window.top; } catch (e) { framed = true; }
    if (params.get('embed') === '1' || framed) document.body.classList.add('embed');
  })();
  // Language toggle button (also mirrors the homepage's choice via ?lang=).
  document.addEventListener('DOMContentLoaded', function () {
    MSI18N.apply();
    var btn = document.querySelector('[data-lang-toggle]');
    if (btn) {
      btn.textContent = MSI18N.lang === 'zh' ? 'EN' : '中文';
      btn.addEventListener('click', function () {
        MSI18N.toggle();
        btn.textContent = MSI18N.lang === 'zh' ? 'EN' : '中文';
      });
    }
  });
</script>
<script src="game.js?v=6"></script>
</body>
</html>
