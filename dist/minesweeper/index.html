<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Minesweeper — Anton’s Arcade</title>
<meta name="theme-color" content="#090909" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="style.css?v=3" />
</head>
<body>
  <header class="arcade-header"><a class="arcade-brand" href="../index.html">ANTON’S ARCADE</a><a class="back-link" href="../index.html">← 返回首页</a></header>
  <main class="desktop">
    <div class="game-intro"><span>NO. 001 / A LITTLE LOGIC, A LITTLE JOY.</span><h1>Minesweeper<span>扫雷</span></h1><p>熟悉的方格，全新的一局。让逻辑先走。</p></div>
    <div class="window" id="gameWindow">
      <!-- Title bar -->
      <div class="titlebar">
        <div class="titlebar-left">

          <span class="titlebar-text">THE PLAYING FIELD</span>
        </div>
        <span class="game-badge">LOGIC / PLAY</span>
      </div>

      <!-- Menu bar -->
      <div class="menubar">
        <button class="menu-btn" id="menuGame" data-menu="game">Game</button>
        <button class="menu-btn" id="menuHelp" data-menu="help">Help</button>
      </div>

      <!-- Dropdown menus -->
      <div class="menu-popover" id="popoverGame" hidden>
        <button type="button" class="menu-item" data-action="new" onclick="Game.menuAction('new')">New&nbsp;&nbsp;<span class="menu-short">F2</span></button>
        <div class="menu-sep"></div>
        <button type="button" class="menu-item" data-action="beginner">Beginner&nbsp;&nbsp;<span class="menu-check" id="checkBeginner">✓</span></button>
        <button type="button" class="menu-item" data-action="intermediate">Intermediate</button>
        <button type="button" class="menu-item" data-action="expert">Expert</button>
        <div class="menu-sep"></div>
        <button type="button" class="menu-item" data-action="sound">
          Sound
          <span class="menu-check" id="checkSound">✓</span>
        </button>
      </div>
      <div class="menu-popover" id="popoverHelp" hidden>
        <button type="button" class="menu-item" data-action="howto" onclick="Game.menuAction('howto')">How to Play</button>
        <button type="button" class="menu-item" data-action="about" onclick="Game.menuAction('about')">About</button>
      </div>

      <!-- Game shell -->
      <div class="game-shell">
        <!-- Top row -->
        <div class="top-panel">
          <div class="counter" id="mineCounter" aria-label="Mine counter">010</div>
          <div class="top-center">
            <button class="face" id="faceButton" title="New game" aria-label="New game">🙂</button>
            <button class="face pause-btn" id="pauseButton" title="Pause (P)" aria-label="Pause">⏸</button>
          </div>
          <div class="counter" id="timerCounter" aria-label="Timer">00:00</div>
        </div>

<!-- Board -->
        <div class="board-wrap">
          <div class="board" id="board" role="grid"></div>
          <div class="pause-overlay" id="pauseOverlay" hidden>
            <span class="pause-msg">⏸ PAUSED</span>
          </div>
        </div>

        <!-- Status bar -->
        <div class="statusbar">
          <span id="statusText">Ready</span>
          <span class="status-hint">Right-click to flag</span>
        </div>

        <!-- Seed controls -->
        <div class="seed-panel">
          <label class="seed-label" for="seedInput">Seed</label>
          <input id="seedInput" class="seed-input" type="text" maxlength="40"
                 placeholder="e.g. ABC123" spellcheck="false" autocomplete="off" />
          <button id="seedApply" class="seed-btn" title="New game with this seed">New</button>
          <button id="seedRandom" class="seed-btn" title="Random seed">🎲</button>
        </div>
      </div>
    </div>
    <p class="game-footnote">左键翻开 · 右键插旗 · F2 重开 · P 暂停</p>
  </main>

<script src="game.js?v=3"></script>
</body>
</html>
